# Drop this file in /etc/ssh/sshd_config.d/ on the Jetson
# Then: sudo systemctl restart ssh

# Key-only authentication (no passwords over SSH)
PasswordAuthentication no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
UsePAM yes

# Disable root login
PermitRootLogin no

# Only allow your user. Replace YOUR_USERNAME before using this file,
# any other user is locked out of SSH.
AllowUsers YOUR_USERNAME

# Security hardening
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
